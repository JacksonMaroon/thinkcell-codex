name: Portable plugin validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r plugins/thinkcell-codex/skills/thinkcell-edit/scripts/requirements.txt
      - name: Verify release integrity and documentation links
        run: python plugins/thinkcell-codex/skills/thinkcell-edit/scripts/validate_release.py
      - name: Verify packaged capability routes
        run: python plugins/thinkcell-codex/skills/thinkcell-edit/scripts/capabilities.py check
      - name: Run portable regressions
        run: python plugins/thinkcell-codex/skills/thinkcell-edit/scripts/run_portable_tests.py
